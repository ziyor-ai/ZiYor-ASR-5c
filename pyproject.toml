[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-asr-basic5"
version = "0.1.0"
description = "A five-component Chinese meeting transcription baseline"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "NOTICE", "vendor/ReDimNet2-LICENSE"]
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
meeting-asr-basic5 = "basic5.cli:main"

[tool.setuptools.packages.find]
where = [".", "vendor"]
include = ["basic5*", "redimnet2*"]

[tool.setuptools]
include-package-data = true
